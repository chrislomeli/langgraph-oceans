[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-oceans"
version = "0.1.0"
description = "Ocean-mammal conservation agent — LangGraph agent with hybrid RAG + photo-ID, seeded from the world-simulator framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Chris Lomeli"}
]
keywords = ["langgraph", "agent", "rag", "conservation", "photo-id", "eval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Seeded from world-simulator: framework (evals/framework, llm, prompts,
# stores/postgres gateway) only. Wildfire/code_intel-specific deps
# (tree-sitter, scipy, text-splitters) were pruned. Geo + embedding deps kept
# because the conservation build needs them.
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=1.1.12",
    "langchain-anthropic>=1.4.0",
    "langchain-ollama>=1.1.0",
    "langsmith>=0.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "numpy>=2.4.4",
    "pgvector>=0.4.2",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "psycopg-pool>=3.3.1",
    "python-ulid>=3.1.0",
    "structlog>=25.5.0",
    "fastembed>=0.8.0",
    "geopandas>=1.1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "ipykernel>=7.2.0",
    "pillow>=12.2.0",
    "requests>=2.34.2",
    "pandas>=3.0.3",
    "sqlalchemy>=2.0.50",
    "pandas-stubs~=3.0.3",
    "torch>=2.12.0",
    "open-clip-torch>=3.3.0",
    "peft>=0.19.1",
    "transformers>=5.10.2",
    "timm>=1.0.27",
    "pdfplumber>=0.11.10",
]


[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "nbconvert>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "exceptions", "logging_config", "evals", "llm", "prompts", "stores", "conservation"]

[tool.hatch.build.targets.wheel]
# src-layout: strip the "src/" prefix so modules import at top level
# (config, exceptions, evals, llm, ...). Using sources+include (instead of
# force-include) keeps editable installs path-based — no physical copies in
# site-packages that would shadow the live source under src/.
sources = ["src"]
include = [
    "src/config.py",
    "src/exceptions.py",
    "src/logging_config.py",
    "src/py.typed",
    "src/evals",
    "src/llm",
    "src/models",
    "src/prompts",
    "src/stores",
    "src/tools",
    "src/training",
]

[project.urls]
Homepage = "https://github.com/chrislomeli/langgraph-oceans"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["src"]


